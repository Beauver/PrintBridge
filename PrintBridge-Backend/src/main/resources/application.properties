# ---------------------------------------------------------------
# PrintBridge configuration. Values come from environment variables
# (see /.env.example) with local-dev defaults matching /local.
# ---------------------------------------------------------------

# --- HTTP / uploads ---
quarkus.http.port=8080
quarkus.http.limits.max-body-size=${UPLOAD_MAX_SIZE_MB:100}M
quarkus.http.limits.max-form-attribute-size=${UPLOAD_MAX_SIZE_MB:100}M

# --- CORS (Angular frontend) ---
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${FRONTEND_ORIGIN:http://localhost:4200}
quarkus.http.cors.methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
quarkus.http.cors.headers=Authorization,Content-Type,Accept
quarkus.http.cors.exposed-headers=Content-Disposition
quarkus.http.cors.access-control-max-age=24H

# --- Database ---
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/printbridge}
quarkus.datasource.username=${DB_USER:printbridge}
quarkus.datasource.password=${DB_PASSWORD:change-me}

# Schema is owned by Flyway; Hibernate never changes it.
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.sql-load-script=no-file

# --- Flyway ---
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=classpath:db/migration

# --- Application settings (read via @ConfigProperty) ---
printbridge.spoolman.url=${SPOOLMAN_URL:http://localhost:7912}
printbridge.spoolman.cache-ttl-seconds=${SPOOLMAN_CACHE_TTL_SECONDS:60}
printbridge.storage.path=${STORAGE_PATH:./local/data/uploads}
printbridge.upload.allowed-extensions=${UPLOAD_ALLOWED_EXTENSIONS:stl,3mf}
printbridge.pricing.infill-factor=${PRICING_INFILL_FACTOR:0.2}
printbridge.admin.username=${ADMIN_USERNAME:admin}
printbridge.admin.email=${ADMIN_EMAIL:admin@example.com}
printbridge.admin.password=${ADMIN_PASSWORD:change-me}

# --- Dev profile ---
%dev.quarkus.hibernate-orm.log.sql=true
%dev.quarkus.http.cors.origins=/.*/

# --- Test profile (needs Docker; Dev Services starts a throwaway Postgres) ---
%test.quarkus.datasource.devservices.enabled=true
%test.quarkus.datasource.jdbc.url=
%test.quarkus.datasource.username=
%test.quarkus.datasource.password=

# SmallRye JWT settings get added together with the quarkus-smallrye-jwt extension.
