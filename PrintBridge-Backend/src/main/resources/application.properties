# ---------------------------------------------------------------
# PrintBridge configuration. Values come from environment variables
# (see /.env.example) with local-dev defaults matching /local.
# ---------------------------------------------------------------

# --- HTTP / uploads ---
quarkus.http.port=8080
# All REST endpoints live under /api (the frontend proxies /api to the backend, so the
# browser sees one origin and the refresh-token cookie stays first-party).
quarkus.rest.path=/api
quarkus.http.limits.max-body-size=${UPLOAD_MAX_SIZE_MB:100}M
quarkus.http.limits.max-form-attribute-size=${UPLOAD_MAX_SIZE_MB:100}M

# --- CORS (Angular frontend) ---
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${FRONTEND_ORIGIN:http://localhost:4200}
quarkus.http.cors.methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
quarkus.http.cors.headers=Authorization,Content-Type,Accept
quarkus.http.cors.access-control-allow-credentials=true
quarkus.http.cors.exposed-headers=Content-Disposition
quarkus.http.cors.access-control-max-age=24H

# --- Database ---
quarkus.datasource.db-kind=postgresql
# Connection only for dev (local/ compose stack) and prod. Tests get a throwaway Postgres
# from Dev Services (needs Docker) because no URL is set for the test profile.
%dev.quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/printbridge}
%dev.quarkus.datasource.username=${DB_USER:printbridge}
%dev.quarkus.datasource.password=${DB_PASSWORD:change-me}
%prod.quarkus.datasource.jdbc.url=${DB_URL}
%prod.quarkus.datasource.username=${DB_USER}
%prod.quarkus.datasource.password=${DB_PASSWORD}

# Schema is owned by Flyway; Hibernate never changes it (tests validate the mapping against it).
quarkus.hibernate-orm.schema-management.strategy=none
quarkus.hibernate-orm.sql-load-script=no-file
# JSON columns (model_info.plates) use Hibernate's own Jackson mapper, not the REST layer's settings.
quarkus.hibernate-orm.mapping.format.global=ignore

# --- Flyway ---
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=classpath:db/migration

# --- Application settings (read via @ConfigProperty) ---
# Where users find the source of this installation (AGPL-3.0 §13): point it at your fork if you change PrintBridge.
printbridge.source-url=${SOURCE_URL:https://github.com/Beauver/PrintBridge}
printbridge.spoolman.url=${SPOOLMAN_URL:http://localhost:7912}
printbridge.spoolman.cache-ttl-seconds=${SPOOLMAN_CACHE_TTL_SECONDS:60}
printbridge.storage.path=${STORAGE_PATH:./local/data/uploads}
printbridge.upload.max-size-mb=${UPLOAD_MAX_SIZE_MB:100}
printbridge.upload.allowed-extensions=${UPLOAD_ALLOWED_EXTENSIONS:stl,3mf}
# Slicer service (PrintBridge-Slicer); without it server slicing is unavailable.
printbridge.slicer.url=${SLICER_URL:}
# Analyse files without model info once at startup, in the background.
printbridge.model-info.backfill-on-start=true

# --- Auth ---
# Endpoints without a security annotation are denied: every resource must opt in explicitly.
quarkus.security.jaxrs.deny-unannotated-endpoints=true
mp.jwt.verify.issuer=${JWT_ISSUER:printbridge}
smallrye.jwt.new-token.issuer=${JWT_ISSUER:printbridge}
# In dev and test Quarkus generates a throwaway key pair when no keys are configured.
%prod.smallrye.jwt.sign.key.location=${JWT_PRIVATE_KEY_PATH}
%prod.mp.jwt.verify.publickey.location=${JWT_PUBLIC_KEY_PATH}
printbridge.auth.access-token-ttl=${JWT_ACCESS_TOKEN_TTL:15M}
printbridge.auth.refresh-token-ttl=${REFRESH_TOKEN_TTL:14D}
# Secure cookie flag; disable only for plain-http local development.
printbridge.auth.cookie-secure=${AUTH_COOKIE_SECURE:true}

# --- Dev profile ---
%dev.quarkus.hibernate-orm.log.sql=true
%dev.quarkus.http.cors.origins=/.*/
%dev.printbridge.auth.cookie-secure=false
# The optional slicer from local/ (docker compose --profile slicer up -d).
%dev.printbridge.slicer.url=${SLICER_URL:http://localhost:18000}

# --- Test profile (needs Docker; Dev Services starts a throwaway Postgres) ---
%test.quarkus.hibernate-orm.schema-management.strategy=validate
%test.printbridge.auth.cookie-secure=false
%test.printbridge.storage.path=build/test-uploads
%test.printbridge.upload.max-size-mb=1
%test.printbridge.preview.max-triangles=1000
# Tests run the backfill themselves.
%test.printbridge.model-info.backfill-on-start=false
%test.printbridge.slicing.worker-autostart=false
# Coverage from @QuarkusTest tests is merged with the plain unit tests (see build.gradle.kts).
%test.quarkus.jacoco.reuse-data-file=true
%test.quarkus.jacoco.report=false
