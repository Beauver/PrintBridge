# Local development dependencies for PrintBridge: what the backend needs while you run it and
# the frontend from source. To run PrintBridge itself from images, see deploy/.
# Usage: cd local && docker compose up -d (starts everything: Postgres, slicer and Spoolman)
name: printbridge

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-printbridge}
      POSTGRES_USER: ${POSTGRES_USER:-printbridge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      TZ: ${TZ:-UTC}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Server slicing (OrcaSlicer, ~1.6 GB; built on the first `up`, which takes a few minutes).
  # Leave it out with: docker compose up -d --scale slicer=0
  slicer:
    build:
      context: ../PrintBridge-Slicer
    restart: unless-stopped
    environment:
      TZ: ${TZ:-UTC}
    ports:
      # Localhost only: the service has no authentication.
      - "127.0.0.1:${SLICER_PORT:-18000}:8000"

  # Spoolman, the filament inventory PrintBridge reads (#11); its web UI is on http://localhost:7912.
  # Leave it out with: docker compose up -d --scale spoolman=0
  spoolman:
    image: ghcr.io/donkie/spoolman:${SPOOLMAN_VERSION:-latest}
    restart: unless-stopped
    environment:
      TZ: ${TZ:-UTC}
    ports:
      # Localhost only: Spoolman has no authentication.
      - "127.0.0.1:${SPOOLMAN_PORT:-7912}:8000"
    volumes:
      - spoolman-data:/home/app/.local/share/spoolman

volumes:
  postgres-data:
  spoolman-data:
