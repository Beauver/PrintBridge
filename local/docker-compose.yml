# Local development dependencies for PrintBridge.
# Usage: cd local && docker compose up -d
name: printbridge

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-printbridge}
      POSTGRES_USER: ${POSTGRES_USER:-printbridge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      TZ: ${TZ:-UTC}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  spoolman:
    image: ghcr.io/donkie/spoolman:latest
    restart: unless-stopped
    environment:
      TZ: ${TZ:-UTC}
      SPOOLMAN_DB_TYPE: sqlite
    ports:
      - "${SPOOLMAN_PORT:-7912}:8000"
    volumes:
      - spoolman-data:/home/app/.local/share/spoolman
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Optional: server slicing (OrcaSlicer, ~1.6 GB). Start with: docker compose --profile slicer up -d
  slicer:
    profiles: [slicer]
    build:
      context: ../PrintBridge-Slicer
    restart: unless-stopped
    environment:
      TZ: ${TZ:-UTC}
    ports:
      - "${SLICER_PORT:-18000}:8000"

volumes:
  postgres-data:
  spoolman-data:
