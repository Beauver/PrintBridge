# Local development dependencies for PrintBridge: what the backend needs while you run it and
# the frontend from source. To run PrintBridge itself from images, see deploy/.
# Usage: cd local && docker compose up -d
name: printbridge

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-printbridge}
      POSTGRES_USER: ${POSTGRES_USER:-printbridge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      TZ: ${TZ:-UTC}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Optional: server slicing (OrcaSlicer, ~1.6 GB). Start with: docker compose --profile slicer up -d
  slicer:
    profiles: [slicer]
    build:
      context: ../PrintBridge-Slicer
    restart: unless-stopped
    environment:
      TZ: ${TZ:-UTC}
    ports:
      # Localhost only: the service has no authentication.
      - "127.0.0.1:${SLICER_PORT:-18000}:8000"

volumes:
  postgres-data:
