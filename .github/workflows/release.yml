name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish ${{ matrix.image }}
    needs: ci
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: printbridge-backend
            context: PrintBridge-Backend
            file: PrintBridge-Backend/src/main/docker/Dockerfile.jvm
            platforms: ${{ matrix.platforms }}
          - image: printbridge-frontend
            context: PrintBridge-Frontend
            file: PrintBridge-Frontend/Dockerfile
            platforms: ${{ matrix.platforms }}
          # OrcaSlicer's AppImage is x86_64 only in this image (see PrintBridge-Slicer/Dockerfile).
          - image: printbridge-slicer
            context: PrintBridge-Slicer
            file: PrintBridge-Slicer/Dockerfile
            platforms: linux/amd64
    steps:
      - uses: actions/checkout@v4

      - name: Compute tags
        id: tags
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
          IMAGE: beauver/${{ matrix.image }}
        run: |
          version="${TAG#v}"
          tags="$IMAGE:$version"
          # "latest" only if this release is GitHub's current latest (never for prereleases)
          latest_tag=$(gh api "repos/$REPO/releases/latest" --jq .tag_name 2>/dev/null || true)
          if [ "$PRERELEASE" != "true" ] && [ "$latest_tag" = "$TAG" ]; then
            tags="$tags,$IMAGE:latest"
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "Tags: $tags"

      - uses: actions/setup-java@v4
        if: matrix.image == 'printbridge-backend'
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        if: matrix.image == 'printbridge-backend'
      - name: Build backend app
        if: matrix.image == 'printbridge-backend'
        working-directory: PrintBridge-Backend
        run: chmod +x gradlew && ./gradlew quarkusBuild -x test --no-daemon

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: ${{ matrix.platforms }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
