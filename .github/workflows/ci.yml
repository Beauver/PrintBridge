name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  backend:
    name: Backend (build + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: PrintBridge-Backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      # Tests use Quarkus Dev Services (Postgres via Docker, available on the runner)
      - run: ./gradlew build --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-reports
          path: PrintBridge-Backend/build/reports/tests
          if-no-files-found: ignore

  frontend:
    name: Frontend (build + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: PrintBridge-Frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: PrintBridge-Frontend/package-lock.json
      - run: npm ci
      - run: npx prettier --check "src/**/*.{ts,html,css,scss}"
      - run: npx ng test --no-watch
      - run: npm run build -- --configuration production

  docker:
    name: Docker images build (no push)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build backend app (skip tests, already run)
        working-directory: PrintBridge-Backend
        run: chmod +x gradlew && ./gradlew quarkusBuild -x test --no-daemon
      - uses: docker/setup-buildx-action@v3
      - name: Backend image
        uses: docker/build-push-action@v6
        with:
          context: PrintBridge-Backend
          file: PrintBridge-Backend/src/main/docker/Dockerfile.jvm
          push: false
          cache-from: type=gha,scope=backend
      - name: Frontend image
        uses: docker/build-push-action@v6
        with:
          context: PrintBridge-Frontend
          push: false
          cache-from: type=gha,scope=frontend
