<div class="page">
  <h1 class="h3 mb-3">All requests</h1>

  <div class="row g-2 mb-3">
    <div class="col-sm-4 col-lg-3">
      <label class="visually-hidden" for="status-filter">Status</label>
      <select
        id="status-filter"
        class="form-select"
        [formControl]="statusFilter"
        data-cy="all-requests-status"
      >
        @for (option of filterOptions; track option.value) {
          <option [value]="option.value">{{ option.label }}</option>
        }
      </select>
    </div>
    <div class="col-sm-8 col-lg-5">
      <label class="visually-hidden" for="request-search">Search</label>
      <input
        id="request-search"
        type="search"
        class="form-control"
        placeholder="Search name or username"
        [formControl]="search"
        data-cy="all-requests-search"
      />
    </div>
  </div>

  @if (error()) {
    <div class="alert alert-danger py-2" role="alert" data-cy="all-requests-error">
      {{ error() }}
      <button type="button" class="btn btn-link btn-sm p-0 ms-2 align-baseline" (click)="load()">
        Try again
      </button>
    </div>
  }

  @if (loading()) {
    <div class="text-body-secondary" data-cy="all-requests-loading">
      <span class="spinner-border spinner-border-sm me-2" aria-hidden="true"></span>Loading…
    </div>
  } @else if (!error() && requests().length === 0) {
    <div class="card card-body text-center text-body-secondary py-4" data-cy="all-requests-empty">
      No requests match this filter.
    </div>
  } @else if (requests().length > 0) {
    <app-request-list [requests]="requests()" [showOwner]="true" />
  }
</div>
