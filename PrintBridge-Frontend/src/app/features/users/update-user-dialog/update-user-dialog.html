<form [formGroup]="form()" (ngSubmit)="save()" novalidate data-cy="update-user-dialog">
  <div class="modal-header">
    <h2 class="modal-title h5 text-break" data-cy="update-user-title">
      Update {{ user()?.username }}
    </h2>
    <button type="button" class="btn-close" aria-label="Close" (click)="cancel()"></button>
  </div>

  <div class="modal-body">
    @if (saveError()) {
      <div class="alert alert-danger py-2" role="alert" data-cy="update-user-error">
        {{ saveError() }}
      </div>
    }
    <app-account-fields
      [form]="form()"
      [askCurrentPassword]="ownAccount()"
      idPrefix="update-user"
    />
  </div>

  <div class="modal-footer">
    <button
      type="button"
      class="btn btn-outline-secondary"
      (click)="cancel()"
      data-cy="update-user-cancel"
    >
      Cancel
    </button>
    <button type="submit" class="btn btn-primary" [disabled]="saving()" data-cy="update-user-save">
      @if (saving()) {
        Saving…
      } @else {
        Save
      }
    </button>
  </div>
</form>
