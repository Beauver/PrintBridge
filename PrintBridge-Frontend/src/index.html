<!doctype html>
<html lang="en" data-bs-theme="dark">
  <head>
    <meta charset="utf-8" />
    <title>PrintBridge</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <script>
      // Apply the saved theme before Angular starts, so light-mode users don't see a dark flash.
      try {
        var theme = localStorage.getItem('pb-theme');
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.bsTheme = theme;
      } catch (e) {}
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
