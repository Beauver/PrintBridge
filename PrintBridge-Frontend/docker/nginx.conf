server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Hashed assets can be cached aggressively
  location ~* \.(?:js|css|woff2?|png|jpg|svg|ico)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # SPA fallback
  location / {
    try_files $uri $uri/ /index.html;
  }
}
